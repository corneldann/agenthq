<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentHQ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --text: #e2e8f0;
      --muted: #6b7280;
      --accent: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --sidebar-w: 200px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace;
      font-size: 13px;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar .brand {
      padding: 16px 16px 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    #sidebar nav {
      flex: 1;
      padding: 8px 0;
      overflow-y: auto;
    }

    #sidebar nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      border-radius: 0;
      transition: color 0.15s, background 0.15s;
      position: relative;
    }

    #sidebar nav a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    #sidebar nav a.active { color: var(--text); background: rgba(59,130,246,0.12); }

    /* Work dot — pulsing blue indicator when jobs running */
    #sidebar nav a .work-dot {
      display: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: auto;
      animation: pulse 1.5s ease-in-out infinite;
    }

    #sidebar nav a.has-running .work-dot { display: block; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.75); }
    }

    #sidebar .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    #sidebar .sidebar-footer button {
      width: 100%;
      padding: 7px 12px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 4px;
      color: var(--red);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #sidebar .sidebar-footer button:hover { background: rgba(239,68,68,0.22); }

    /* ── Main content ────────────────────────────────────────────── */
    #page-root {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* ── Toast stack ─────────────────────────────────────────────── */
    #toast-stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      max-width: 360px;
      pointer-events: none;
    }

    #toast-stack > * { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="sidebar"></div>
  <main id="page-root"></main>
  <div id="toast-stack"></div>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="main.ts"></script>
</body>
</html>
